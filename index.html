<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space X Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo';box-sizing:border-box}body{background:#050510;color:#fff;margin:0}
.top{background:linear-gradient(90deg,#0f0c29,#302b63);padding:22px;text-align:center;border-bottom:2px solid #a78bfa}
.search{background:#11112a;padding:12px;text-align:center;position:sticky;top:0;z-index:99}
.search input{padding:10px 15px;border-radius:20px;border:1px solid #333;width:65%;background:#1a1a3a;color:#fff}
#box{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.card{background:#1a1a35;border:1px solid #2a2a5a;border-radius:14px;padding:15px;text-align:center}
.card b{font-size:13px;display:block} .card span{font-size:11px;color:#888;display:block;margin:5px 0 10px}
.card a{background:#fff;color:#000;padding:8px;display:block;border-radius:8px;text-decoration:none;font-weight:bold;font-size:12px}
.assist{background:#0f0f25;margin:15px;border-radius:16px;padding:18px;border:1px solid #a78bfa}
.footer{background:#080818;padding:22px;text-align:center;border-top:1px solid #1a1a3a;margin-top:20px}
.footer b{color:#a78bfa}
</style>
</head>
<body>
<div class="top"><h1> SPACE X ACADEMY</h1><p></p></div>
<div class="search"><input id="s" placeholder="ابحث: Python, HTML, Figma..."></div>
<div id="box"></div>

<div class="assist">
<h3 style="text-align:center;margin:0 0 12px">✨ Gemini - المساعد الذكي</h3>
<div style="display:flex;gap:8px"><input id="q" placeholder=اسألني؟" style="flex:1;padding:11px;border-radius:10px;border:1px solid #333;background:#1a1a3a;color:#fff"><button onclick="ask()" style="padding:11px 18px;border-radius:10px;border:none;background:#a78bfa;font-weight:bold;cursor:pointer">إرسال</button></div>
<div id="a" style="margin-top:12px;color:#ccc;font-size:13px;line-height:1.7"></div>
</div>

<div class="footer">
<div style="font-weight:bold;font-size:14px">: <b/ </b></div>
<div style="font-size:11px;color:#666;margin-top:8px">Space X Academy © 2026 - Created by dinaalssawy - allrightsreserved </div>
</div>

<script>
const courses=[
["HTML5","الزيرو - 37 فيديو","https://www.youtube.com/playlist?list=PLDoPjvoNmBAwltIl0UIdRSzfh_C1jG9YlN"],
["CSS3","الزيرو - 88 فيديو","https://www.youtube.com/playlist?list=PLDoPjvoNmBAy1M0pIugF2vJ6Y7mN9gZt1"],
["JavaScript","الزيرو - 188 فيديو","https://www.youtube.com/playlist?list=PLDoPjvoNmBAx3kiplQR_oeDqLrvUD9rUs"],
["Python","الزيرو - 150 فيديو","https://www.youtube.com/playlist?list=PLDoPjvoNmBAyE2A4PVcdOBxbMnPj-OHQ"],
["React JS","Codezilla","https://www.youtube.com/results?search_query=react+js+elzero"],
["PHP","PHP 8","https://www.youtube.com/playlist?list=PLDoPjvoNmBAy41u35AqJUrI-H83DObUDq"],
["MySQL","قواعد بيانات","https://www.youtube.com/results?search_query=mysql+elzero"],
["Git & GitHub","Git","https://www.youtube.com/results?search_query=git+github+elzero"],
["Figma","UI/UX","https://www.youtube.com/results?search_query=figma+arabic+course"],
["Photoshop","فوتوشوب","https://www.youtube.com/results?search_query=photoshop+elzero"],
["Illustrator","اليستريتور","https://www.youtube.com/results?search_query=illustrator+arabic"],
["After Effects","موشن","https://www.youtube.com/results?search_query=after+effects+arabic"],
["ذكاء اصطناعي","مقدمة AI","https://www.youtube.com/results?search_query=artificial+intelligence+arabic+course"],
["Machine Learning","تعلم آلة","https://www.youtube.com/results?search_query=machine+learning+arabic"],
["ChatGPT","احتراف","https://www.youtube.com/results?search_query=chatgpt+course+arabic"],
["Flutter","تطبيقات","https://www.youtube.com/results?search_query=flutter+arabic+course"],
["Cyber Security","امن سيبراني","https://www.youtube.com/results?search_query=cyber+security+arabic"],
["Blender","3D","https://www.youtube.com/results?search_query=blender+3d+arabic"],
["Excel","اكسيل","https://www.youtube.com/results?search_query=excel+arabic+course"],
["WordPress","ووردبريس","https://www.youtube.com/results?search_query=wordpress+elzero"]
];
function render(list){let h="";list.forEach(c=>{h+=`<div class="card"><b>${c[0]}</b><span>${c[1]}</span><a href="${c[2]}" target="_blank">ابدأ التعلم</a></div>`});document.getElementById("box").innerHTML=h;}
document.getElementById("s").addEventListener("input",e=>{let v=e.target.value.toLowerCase();render(courses.filter(c=>c[0].toLowerCase().includes(v)||c[1].includes(v)))});
function ask(){let qq=document.getElementById("q").value.trim();let aa=document.getElementById("a");if(!qq){aa.innerHTML="اكتبي سؤالك";return;}aa.innerHTML="⏳ Gemini بيفكر...";setTimeout(()=>{aa.innerHTML=`بالنسبة لـ "${qq}" : ابدأي بالاساسيات HTML -> CSS -> JS وبعدها تخصصي! ;},700);}
render(courses);
</script>
</body>
</html>
