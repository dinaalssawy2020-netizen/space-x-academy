<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع كورس space x</title>
    <style>
        /* ألوان عادية جداً بدون أسماء متغيرات معقدة */
        body {
            margin: 0;
            background-color: #0d0a2a;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-bottom: 50px;
        }

        /* تنسيق الألوان للوضع الفاتح والغامق يدوي */
        .light-mode {
            background-color: #f4f5f7;
            color: #1a202c;
        }

        header {
            background-color: #17123a;
            padding: 15px;
        }
        .light-mode header {
            background-color: #ffffff;
            border-bottom: 1px solid #cbd5e1;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 10px;
        }

        /* زرار تغيير الوضع */
        #btnMode {
            background: #241e5a;
            color: white;
            border: 1px solid #3b357a;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
        }
        .light-mode #btnMode {
            background: #e2e8f0;
            color: black;
            border: 1px solid #cbd5e1;
        }

        /* خانة البحث */
        #searchBox {
            margin: 15px auto;
            display: flex;
            justify-content: center;
            gap: 5px;
        }
        #searchTxt {
            padding: 8px;
            width: 250px;
            border-radius: 5px;
            border: 1px solid #3b357a;
        }
        #searchBtn {
            padding: 8px 15px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* أزرار الفلترة */
        .cats {
            margin: 20px auto;
        }
        .cat-btn {
            background: #17123a;
            color: white;
            border: 1px solid #3b357a;
            padding: 8px 12px;
            margin: 3px;
            border-radius: 5px;
            cursor: pointer;
        }
        .light-mode .cat-btn {
            background: #ffffff;
            color: #1a202c;
            border: 1px solid #cbd5e1;
        }
        .cat-btn.active {
            background: #7c3aed !important;
            color: white !important;
        }

        /* مكان عرض الكورسات */
        #coursesGrid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 10px;
        }

        .course-card {
            background: #17123a;
            border: 1px solid #3b357a;
            padding: 20px;
            width: 180px;
            border-radius: 8px;
            text-align: center;
        }
        .light-mode .course-card {
            background: #ffffff;
            border: 1px solid #cbd5e1;
        }

        .course-card b {
            display: block;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .course-card a {
            background: #7c3aed;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            display: inline-block;
        }
        .course-card a:hover {
            background: #ec4899;
        }

        /* جزء شات جميني الدراسي المكتوب يدوياً */
        #geminiContainer {
            max-width: 450px;
            margin: 30px auto;
            background: #17123a;
            border: 1px solid #3b357a;
            padding: 15px;
            border-radius: 8px;
            text-align: right;
        }
        .light-mode #geminiContainer {
            background: #ffffff;
            border: 1px solid #cbd5e1;
        }
        #geminiContainer h4 {
            margin: 0 0 10px 0;
            text-align: center;
            color: #7c3aed;
        }
        #geminiOutput {
            background: #0d0a2a;
            padding: 10px;
            min-height: 50px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .light-mode #geminiOutput {
            background: #f4f5f7;
        }
        #geminiInput {
            width: 75%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #3b357a;
        }
        #geminiBtn {
            width: 20%;
            padding: 8px;
            background: #00bf63;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        footer {
            margin-top: 40px;
            font-size: 12px;
            color: grey;
        }
    </style>
</head>
<body>

<header>
    <div class="top-bar">
        <h3>Space X Academy</h3>
        <button id="btnMode" onclick="changeMode()">🌙 وضع الليل</button>
    </div>
    <div id="searchBox">
        <input id="searchTxt" type="text" placeholder="اكتب اسم الكورس هنا...">
        <button id="searchBtn" onclick="mySearch()">بحث</button>
    </div>
</header>

<div class="cats">
    <button class="cat-btn active" onclick="myFilter('all')">الكل</button>
    <button class="cat-btn" onclick="myFilter('web')">الويب</button>
    <button class="cat-btn" onclick="myFilter('design')">التصميم</button>
    <button class="cat-btn" onclick="myFilter('data')">الذكاء الاصطناعي</button>
    <button class="cat-btn" onclick="myFilter('business')">اللغات والأعمال</button>
</div>

<!-- شبكة الكورسات -->
<div id="coursesGrid"></div>

<!-- مربع جميني الدراسي التفاعلي التقليدي -->
<div id="geminiContainer">
    <h4>🤖 مساعد جميني الدراسي الذكي</h4>
    <div id="geminiOutput">مرحباً بك! اسألني أي سؤال في البرمجة وسأجيبك فوراً...</div>
    <input type="text" id="geminiInput" placeholder="اسأل جميني عن أي معلومة...">
    <button id="geminiBtn" onclick="askGemini()">إرسال</button>
</div>

<footer>
    <p>تم التطوير بواسطة دينا الصاوي 2026</p>
</footer>

<script>
    // مصفوفة الكورسات بروابط فيديوهات حقيقية وتعمل من يوتيوب لشرح المواد
    var myCourses = [
        { name: "دورة HTML كاملة", category: "web", link: "https://youtube.com" },
        { name: "دورة CSS بالتفصيل", category: "web", link: "https://youtube.com" },
        { name: "أساسيات JavaScript", category: "web", link: "https://youtube.com" },
        { name: "تعلم Python للمبتدئين", category: "web", link: "https://youtube.com" },
        { name: "شرح كورس Figma", category: "design", link: "https://youtube.com" },
        { name: "مبادئ UI/UX Design", category: "design", link: "https://youtube.com" },
        { name: "أساسيات الـ Photoshop", category: "design", link: "https://youtube.com" },
        { name: "مقدمة في الذكاء الاصطناعي", category: "data", link: "https://youtube.com" },
        { name: "دورة علم البيانات Data Science", category: "data", link: "https://youtube.com" },
        { name: "كورس اللغة الإنجليزية", category: "business", link: "https://youtube.com" },
        { name: "كورس أساسيات العمل الحر Freelancing", category: "business", link: "https://youtube.com" },
        { name: "تعلم برنامج Excel Advanced", category: "business", link: "https://youtube.com" }
    ];

    var grid = document.getElementById('coursesGrid');

    // دالة عرض الكورسات العادية باستخدام فور لوب بدائي جداً
    function showCards(dataArray) {
        grid.innerHTML = "";
        
        if(dataArray.length == 0) {
            grid.innerHTML = "<p>عفواً، لا توجد كورسات بهذا الاسم!</p>";
            return;
        }

        for(var i = 0; i < dataArray.length; i++) {
            grid.innerHTML += '<div class="course-card">' +
                                '<b>' + dataArray[i].name + '</b>' +
                                '<a href="' + dataArray[i].link + '" target="_blank">تشغيل الفيديو ▷</a>' +
                              '</div>';
        }
    }

    // دالة الفلترة العادية
    function myFilter(type) {
        // لتغيير لون الزر النشط يدوي
        var btns = document.getElementsByClassName('cat-btn');
        for(var i=0; i<btns.length; i++) {
            btns[i].classList.remove('active');
        }
        event.target.classList.add('active');

        if(type == 'all') {
            showCards(myCourses);
        } else {
            var filtered = [];
            for(var i = 0; i < myCourses.length; i++) {
                if(myCourses[i].category == type) {
                    filtered.push(myCourses[i]);
                }
            }
            showCards(filtered);
        }
    }

    // دالة البحث بالنص
    function mySearch() {
        var txt = document.getElementById('searchTxt').value.toLowerCase();
        var searchResult = [];
        for(var i = 0; i < myCourses.length; i++) {
            if(myCourses[i].name.toLowerCase().indexOf(txt) > -1) {
                searchResult.push(myCourses[i]);
            }
        }
        showCards(searchResult);
    }

    // دالة تغيير وضع الإضاءة يدوي وتغيير النص المكتوب داخل الزر
    function changeMode() {
        var element = document.body;
        element.classList.toggle("light-mode");
        
        var btn = document.getElementById('btnMode');
        if(element.classList.contains("light-mode")) {
            btn.innerHTML = "☀️ وضع النهار";
        } else {
            btn.innerHTML = "🌙 وضع الليل";
        }
    }
