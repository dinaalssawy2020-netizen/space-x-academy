<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space X Academy | الرئيسية</title>
    <style>
        /* المتغيرات الافتراضية للوضع المظلم (Dark Mode) */
        :root {
            --bg-main: #0d0a2a;
            --bg-header: #17123a;
            --bg-input: #241e5a;
            --bg-card: #17123a;
            --primary: #7c3aed;
            --primary-hover: #ec4899;
            --text-color: #ffffff;
            --text-muted: #a0aec0;
            --border-color: #3b357a;
        }

        /* متغيرات الوضع المضيء (Light Mode) */
        [data-theme="light"] {
            --bg-main: #f4f5f7;
            --bg-header: #ffffff;
            --bg-input: #e2e8f0;
            --bg-card: #ffffff;
            --primary: #7c3aed;
            --primary-hover: #ec4899;
            --text-color: #1a202c;
            --text-muted: #4a5568;
            --border-color: #cbd5e1;
        }

        body {
            margin: 0;
            background-color: var(--bg-main);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding-bottom: 60px;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            background-color: var(--bg-header);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto 15px auto;
            padding: 0 15px;
        }

        header h3 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        /* زر تبديل الوضع */
        #themeToggle {
            background-color: var(--bg-input);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: 0.3s;
        }

        #themeToggle:hover {
            border-color: var(--primary);
        }

        #searchWrap {
            display: flex;
            gap: 8px;
            justify-content: center;
            max-width: 450px;
            margin: 0 auto;
        }

        #search {
            flex: 1;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid transparent;
            background-color: var(--bg-input);
            color: var(--text-color);
            outline: none;
            transition: 0.3s;
        }

        #search:focus {
            border-color: var(--primary);
        }

        #searchBtn {
            background-color: var(--primary);
            color: #ffffff;
            font-weight: bold;
            border: 0;
            padding: 0 25px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }

        #searchBtn:hover {
            background-color: var(--primary-hover);
        }

        /* أقسام التصفية */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 25px auto;
            flex-wrap: wrap;
            max-width: 800px;
            padding: 0 15px;
        }

        .filter-btn {
            background-color: var(--bg-card);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        /* شبكة الكورسات */
        #box {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--bg-card);
            padding: 25px 15px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            transition: transform 0.3s, box-shadow 0.3s, background-color 0.3s;
            border: 1px solid var(--border-color);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(124, 58, 237, 0.15);
        }

        .card b {
            font-size: 16px;
            min-height: 40px;
            display: flex;
            align-items: center;
        }

        .card a {
            background-color: var(--primary);
            color: #ffffff;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            width: 80%;
            transition: 0.3s;
        }

        .card a:hover {
            background-color: var(--primary-hover);
        }

        footer {
            padding: 25px;
            background-color: var(--bg-header);
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 40px;
            border-top: 1px solid var(--border-color);
            transition: background-color 0.3s;
        }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <h3>Space X Academy</h3>
        <!-- زر التبديل التفاعلي للوضع -->
        <button id="themeToggle" onclick="toggleTheme()">🌙 وضع الليل</button>
    </div>
    <div id="searchWrap">
        <input id="search" type="text" placeholder="ابحث عن كورس أو مجال...">
        <button id="searchBtn">بحث</button>
    </div>
</header>

<div class="filter-container">
    <button class="filter-btn active" onclick="filterCourses('all')">الكل</button>
    <button class="filter-btn" onclick="filterCourses('web')">تطوير الويب</button>
    <button class="filter-btn" onclick="filterCourses('design')">التصميم الرقمي</button>
    <button class="filter-btn" onclick="filterCourses('data')">البيانات والذكاء الاصطناعي</button>
    <button class="filter-btn" onclick="filterCourses('business')">الأعمال واللغات</button>
</div>

<div id="box"></div>

<footer>
    <p>&copy;created by dinaalssawy.</p>
</footer>

<script>
    // قاعدة البيانات المنظمة

        { name: "Digital Marketing", category: "business", link: "#" },
        { name: "Project Management", category: "business", link: "#" },
        { name: "Excel Advanced", category: "business", link: "#" }
    ];

    const box = document.getElementById('box');
    const searchInput = document.getElementById('search');
    const themeToggleBtn = document.getElementById('themeToggle');

    // منطق التبديل بين الوضعين المظلم والمضيء وحفظ الخيار
    const currentTheme = localStorage.getItem('theme') || 'dark';
    if (currentTheme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        themeToggleBtn.innerHTML = "☀️ وضع النهار";
    }

    function toggleTheme() {
        let theme = document.documentElement.getAttribute('data-theme');
        if (theme === 'light') {
            document.documentElement.removeAttribute('data-theme');
            themeToggleBtn.innerHTML = "🌙 وضع الليل";
            localStorage.setItem('theme', 'dark');
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            themeToggleBtn.innerHTML = "☀️ وضع النهار";
            localStorage.setItem('theme', 'light');
        }
    }

    // دالة عرض الكورسات
    function displayCourses(data) {
        box.innerHTML = "";
        if(data.length === 0) {
            box.innerHTML = `<p style="grid-column: 1/-1; color: var(--text-muted); margin-top: 20px;">لم يتم العثور على كورسات تطابق بحثك.</p>`;
