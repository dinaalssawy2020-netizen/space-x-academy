<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space X Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo';box-sizing:border-box}body{background:#050510;color:#fff;margin:0}
.top{background:#302b63;padding:20px;text-align:center}
#box{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}
.card{background:#1a1a35;border:1px solid #2a2a5a;border-radius:12px;padding:15px;text-align:center}
.card b{font-size:14px;display:block} .card span{font-size:11px;color:#999;display:block;margin:5px 0 10px}
.card a{background:#fff;color:#000;padding:8px;display:block;border-radius:8px;text-decoration:none;font-weight:bold;font-size:12px}
</style>
</head>
<body>
<div class="top"><h1> SPACE X ACADEMY</h1><p> 
<div id="box"></div>
<script>
const courses=[
["HTML5","Elzero - 37 فيديو","https://www.youtube.com/playlist?list=PLDoPjvoNmBAwltIl0UIdRSzfh_C1jG9YlN"],
["CSS3","Elzero - 88 فيديو","https://www.youtube.com/playlist?list=PLDoPjvoNmBAy1M0pIugF2vJ6Y7mN9gZt1"],
["JavaScript","Elzero - 188 فيديو","https://www.youtube.com/playlist?list=PLDoPjvoNmBAx3kiplQR_oeDqLrvUD9rUs"],
["Python","Elzero - 150 فيديو","https://www.youtube.com/playlist?list=PLDoPjvoNmBAyE2A4PVcdOBxbMnPj-OHQ"],
["React","Codezilla","https://www.youtube.com/results?search_query=react+js+elzero"],
["PHP","Elzero PHP 8","https://www.youtube.com/playlist?list=PLDoPjvoNmBAy41u35AqJUrI-H83DObUDq"],
["Laravel","Laravel 10","https://www.youtube.com/results?search_query=laravel+elzero"],
["MySQL","قواعد بيانات","https://www.youtube.com/playlist?list=PLDoPjvoNmBAzH72MTPuAAaYfR3z2Qd7zF"],
["Git & GitHub","Git","https://www.youtube.com/playlist?list=PLDoPjvoNmBAw4SiQH2vN2r6pR5M1t7v9k"],
["Figma","UI/UX Figma","https://www.youtube.com/results?search_query=figma+course+arabic"],
["Photoshop","Photoshop CC","https://www.youtube.com/results?search_query=photoshop+elzero"],
["Illustrator","Illustrator","https://www.youtube.com/results?search_query=illustrator+elzero"],
["ذكاء اصطناعي","مقدمة AI","https://www.youtube.com/results?search_query=artificial+intelligence+arabic"],
["Machine Learning","تعلم آلة","https://www.youtube.com/results?search_query=machine+learning+arabic"],
["ChatGPT","احتراف ChatGPT","https://www.youtube.com/results?search_query=chatgpt+arabic"],
["Flutter","تطبيقات موبايل","https://www.youtube.com/results?search_query=flutter+arabic"],
["Java","Java كاملة","https://www.youtube.com/results?search_query=java+elzero"],
["C++","C++","https://www.youtube.com/results?search_query=c%2B%2B+elzero"],
["Cyber Security","امن سيبراني","https://www.youtube.com/results?search_query=cyber+security+arabic"],
["Blender 3D","Blender","https://www.youtube.com/results?search_query=blender+3d+arabic"]
];
let h="";courses.forEach(c=>{h+=`<div class="card"><b>${c[0]}</b><span>${c[1]}</span><a href="${c[2]}" target="_blank">ابدأ التعلم الآن 🚀</a></div>`});
document.getElementById("box").innerHTML=h;
</script>
</body>
</html>
