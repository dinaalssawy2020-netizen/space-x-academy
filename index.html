<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPACE X ACADEMY</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060614;color:#fff;font-family:'Cairo',sans-serif}
.header{background:#1a1040;padding:18px;text-align:center;font-weight:bold;letter-spacing:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#1e1e3a;border-radius:12px;padding:14px;text-align:center;border:1px solid #2e2e5a}
.card h3{margin:0;font-size:14px}
.card p{margin:5px 0 10px 0;font-size:11px;color:#aaa}
.card a{display:block;background:#fff;color:#000;text-decoration:none;padding:8px;border-radius:8px;font-weight:bold;font-size:12px}
.box-gemini{margin:12px;background:#15152b;border:1px solid #a78bfa;border-radius:12px;padding:14px}
.box-gemini input{width:75%;padding:10px;border-radius:8px;border:1px solid #333;background:#0f0f22;color:#fff}
.box-gemini button{width:20%;padding:10px;border-radius:8px;border:none;background:#a78bfa;font-weight:bold}
.footer{text-align:center;padding:20px;font-size:11px;color:#666;border-top:1px solid #222;margin-top:20px}
.footer b{color:#a78bfa}
</style>
</head>
<body>
<div class="header">SPACE X ACADEMY</div>

<div class="grid" id="grid"></div>

<div class="box-gemini">
<div style="text-align:center;margin-bottom:8px">Gemini - المساعد الذكي ✨</div>
<div style="display:flex;gap:6px;justify-content:center">
<input id="q" placeholder="اسأل؟">
<button onclick="askGemini()">إرسال</button>
</div>
<div id="ans" style="margin-top:10px;font-size:13px;color:#ccc"></div>
</div>

<div class="footer">
<div>: <b>
<div style="margin-top:5px">Space X Academy © 2026 - Created by dinaalssawy - All rights reserved</div>
</div>

<script>
var data = [
["HTML5","الزيرو - 37 فيديو","https://www.youtube.com/playlist?list=PLDoPjvoNmBAwltIl0UIdRSzfh_C1jG9YlN"],
["CSS3","الزيرو - 88 فيديو","https://www.youtube.com/playlist?list=PLDoPjvoNmBAy1M0pIugF2vJ6Y7mN9gZt1"],
["JavaScript","الزيرو","https://www.youtube.com/playlist?list=PLDoPjvoNmBAx3kiplQR_oeDqLrvUD9rUs"],
["Python","الزيرو","https://www.youtube.com/playlist?list=PLDoPjvoNmBAyE2A4PVcdOBxbMnPj-OHQ"],
["React","Codezilla","https://www.youtube.com/results?search_query=react+elzero"],
["Figma","UI/UX","https://www.youtube.com/results?search_query=figma+arabic"],
["Photoshop","فوتوشوب","https://www.youtube.com/results?search_query=photoshop+arabic"],
["AI","ذكاء اصطناعي","https://www.youtube.com/results?search_query=ai+arabic+course"],
["Flutter","موبايل","https://www.youtube.com/results?search_query=flutter+arabic"],
["Cyber Security","امن سيبراني","https://www.youtube.com/results?search_query=cyber+security+arabic"]
];

var grid = document.getElementById("grid");
var html = "";
for(var i=0;i<data.length;i++){
html += '<div class="card"><h3>'+data[i][0]+'</h3><p>'+data[i][1]+'</p><a href="'+data[i][2]+'" target="_blank">ابدأ التعلم 🚀</a></div>';
}
grid.innerHTML = html;

function askGemini(){
var q = document.getElementById("q").value;
var a = document.getElementById("ans");
if(!q){a.innerHTML="اكتب سؤالك";return;}
a.innerHTML="⏳ Gemini بيفكر...";
setTimeout(function(){a.innerHTML="لـ '"+q+"' : ابدأي بالاساسيات HTML ثم CSS ثم JavaScript!";},600);
}
</script>
</body>
</html>
